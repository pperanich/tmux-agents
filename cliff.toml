# git-cliff: drafts CHANGELOG.md sections from the Conventional Commit log.
#
# The draft is a starting point, never the shipped text. This repo's commit SUBJECTS say what
# changed; the bodies say why, and that is the part a reader of the changelog actually needs. So
# `mise run changelog` regenerates the section and the release then edits it by hand.
#
# Machinery commits (ci, chore, test, refactor, style) are dropped: a changelog is for people
# consuming tma, and `git log` remains the record for everyone else.

[changelog]
header = """
# Changelog

Notable changes to tma, newest first. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and tma follows
[Semantic Versioning](https://semver.org/spec/v2.0.0.html) — while the major version is 0, a
breaking change bumps the minor.

Every release also ships prebuilt tarballs and a `SHA256SUMS` file; see
[Install tma](docs/how-to/install-tma.md).

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{% set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### Breaking
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking_description and commit.breaking_description != commit.message %}
  {{ commit.breaking_description | trim | replace(from="\n", to="\n  ") }}
{% endif %}
{%- endfor %}
{% endif %}
{% for group, group_commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""

footer = ""
trim = true

[git]
conventional_commits = true
# Anything that is not a Conventional Commit predates the convention or is a merge; it has no
# place in a user-facing changelog either way.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# The `<!-- N -->` prefixes only order the sections; the template strips them.
commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^revert", group = "<!-- 5 -->Reverted" },
  { message = "^(ci|chore|test|refactor|style|build)", skip = true },
]
