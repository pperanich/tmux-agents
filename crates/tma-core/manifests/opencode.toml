min_engine_version = "0.1"

# OpenCode (https://opencode.ai) — verified against the Homebrew build 1.17.15.
#
# Identity: the process is a Bun single-file executable; `pane_current_command`
# reports `opencode.exe` (the resolved binary), not `opencode` (the launcher
# symlink). Both spellings are listed so a non-Homebrew install that keeps the
# `opencode` comm still matches. Verified live: a pane running `opencode` showed
# `#{pane_current_command} = opencode.exe`.
#
# A nix build needs no third spelling: nix's `wrapProgram` renames the binary to
# `.opencode-wrapped` (tmux reports it truncated, `.opencode-wrapp`), and `normalize_comm`
# strips that wrapper decoration before the match. Left unstripped it broke
# `foreground_is_agent`, which capped every nix-installed OpenCode pane at `unknown`.
[identity]
process_names = ["opencode.exe", "opencode"]

# Hook tier: OpenCode's plugin bridge (a JS module in `~/.config/opencode/plugin/`)
# spawns `tma-hook opencode <event>` with the payload on stdin. `tma install-hooks
# opencode` writes that plugin (see tma/src/install.rs, opencode adapter). The plugin
# normalizes OpenCode's native event bus (verified live: `session.created`,
# `session.status` {busy|idle}, `session.idle`, `session.error`, `permission.asked`,
# plus the `chat.message`/`tool.execute.before` hooks) into the stable wrapper tokens
# below. Registration (start) is covered; there is no session-end event on TUI close
# (the process just exits), so deregistration rides the universal pid-change / pane-close
# path, not a hook. OpenCode emits no Claude-style subagent hooks (confirmed:
# no subagent event observed across driven sessions), so the subagent guard is inert here.
[hooks]
covers = ["working", "idle", "blocked", "lifecycle"]

# session.created — mark the pane an OpenCode pane, record @agent_session, idle. The plugin also
# fires this token once at load, before any session event: `session.created` is emitted only for a
# brand-new session, so a waiting prompt and `opencode --continue` otherwise registered nothing and
# sat at `unknown`. That first fire carries no session id (unknown at load); the `session.created`
# edge that follows a real new session records it.
[[hooks.map]]
event = "session-start"
claim = { lifecycle = "start" }

# session.status{busy} + chat.message + tool.execute.before — a turn is running.
[[hooks.map]]
event = "user-prompt-submit"
claim = { state = "working" }

# session.idle + session.status{idle} — the turn finished, prompt is ready.
[[hooks.map]]
event = "stop"
claim = { state = "idle" }

# permission.asked — OpenCode is waiting on a tool-permission approval. The plugin
# only fires this token for `permission.asked`, so it maps unconditionally (no matcher):
# unlike Claude's `Notification`, OpenCode has no idle-reminder variant on this channel.
[[hooks.map]]
event = "permission-required"
claim = { state = "blocked", detail = "permission" }

# Capture fallback: `blocked` and `working`. The blocked dialog is the state a hookless/quiet
# pane most needs (a permission prompt stops output, so the daemon's quiet-edge capture lands
# right on it); `working` was added 2026-08-19 (see the rule below).
#
# `idle` still carries NO rule, and that is the honest reading: idle is the ABSENCE of the
# working status row, not any positive chrome of its own. The per-message `▣ … · <elapsed>`
# footer the original audit looked at renders in both states, and the row that replaces the
# working bar at idle is the pane's cwd — per-pane text, not a matchable token. As with pi
# (same shape: a `working` rule, no idle rule), the working→idle landing is the `stop` hook's
# job; a hookless pane that finishes a turn therefore HOLDS `working` until a hook or a
# blocker moves it. Registration now happens at plugin load, so a hookless OpenCode pane is
# the rare case rather than the startup default.
#
# The OSC title is NOT usable and this is evidence, not assumption. The original audit found
# it static ("OpenCode"); on 1.18.18 it is state-bearing (`OC | Running <command>`) — but it
# is STALE-STICKY: captured live 2026-08-19, the title still read `OC | Running sleep 40; echo
# done` a full minute after the turn settled and the working row was gone from the screen. A
# title rule would pin such a pane to `working` forever, so the screen row is the only anchor.
[capture]
visible = ["blocked", "working"]

# --- blocked: the tool-permission dialog ------------------------------------------------
# Anchored on the dialog's invariant chrome: the `Permission required` header together
# with the `Allow once` / `Reject` button row. Verified tool-invariant across a bash
# (`# Shell command`) and a file-edit (`→ Edit …`) permission prompt, each captured live;
# the tool-specific subtitle is deliberately NOT matched. Requiring all three tokens makes
# a false block from conversation prose effectively impossible (blocked is the one signal
# users must trust). The engine strips ANSI before matching, so the OSC-colored
# `△ Permission required` reads as contiguous text; `contains` is width-agnostic, so the
# button row wrapping at narrow panes (verified at w60) does not break the match.
# Backed by three real captures: bash-permission at w100 + w60 and edit-permission at w60.
[[rules]]
state = "blocked"
detail = "permission"
priority = 100
region = "tail_lines(24)"
match = { all = [
  { contains = "Permission required" },
  { contains = "Allow once" },
  { contains = "Reject" },
] }

# --- working: the in-flight status row --------------------------------------------------
# While a turn is in flight OpenCode replaces the status row's cwd with an 8-cell progress bar
# and the literal interrupt hint. Only the TEXT is matched: the bar animates (`■`/`⬝` cells
# shift every frame), so it is decoration, not an anchor. The engine strips ANSI before
# matching, which matters here — OpenCode colours the two words separately, so the raw capture
# reads `esc <SGR>interrupt` and only the stripped text is contiguous.
#
# Evidence, six real captures across two OpenCode versions, two providers, and both widths:
# present in opencode_working_w100 (1.17.15, Gemini 2.5 Flash) and opencode_working_w60
# (1.18.18, GPT-5, this pane nix-wrapped); ABSENT from both idle fixtures and all three
# blocked fixtures. That absence is what makes it safe: the row is exclusive to a live turn,
# so it cannot fire on a settled pane, and it cannot shout over a permission prompt (blocked
# is priority 100 and this is 60).
#
# `visible` region, not a tail window: capture is `-S -50`, so on a pane shorter than the
# capture window a prior turn's scrollback sits ABOVE the visible screen and a whole-tail
# match could resurrect a finished turn's row. `visible` clamps to `#{pane_height}` — the same
# leak pi's `Working...` rule closes the same way.
[[rules]]
state = "working"
priority = 60
region = "visible"
match = { contains = "esc interrupt" }
