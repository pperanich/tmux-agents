min_engine_version = "0.1"

[identity]
process_names = ["claude"]

[hooks]
covers = ["working", "idle", "blocked", "lifecycle"]

[[hooks.map]]
event = "SessionStart"
claim = { lifecycle = "start" }

[[hooks.map]]
event = "SessionEnd"
claim = { lifecycle = "end" }

[[hooks.map]]
event = "UserPromptSubmit"
claim = { state = "working" }

[[hooks.map]]
event = "PreToolUse"
claim = { state = "working" }

[[hooks.map]]
event = "PostToolUse"
claim = { state = "working" }

[[hooks.map]]
event = "Notification"
matcher = "permission_prompt|elicitation_dialog"
claim = { state = "blocked", detail = "permission" }

# --- usage-limit auto-continue (Claude Code 2.1.234+, on by default) -----------------------------
# Three `Notification` types report a quota wait, and they split on whose move it is. The installed
# hook carries no matcher, so every notification type already reaches `tma event`; these matchers
# are the whole filter.
#
# `quota_auto_resume_fired` — Claude Code continues the task after the limit paused it (at the
# reset, or sooner when adding credits / upgrading / switching models frees usage). Nobody is
# waiting on the human, so it is `working`, qualified `rate_limit`.
[[hooks.map]]
event = "Notification"
matcher = "quota_auto_resume_fired"
claim = { state = "working", detail = "rate_limit" }

# `quota_auto_resume_stale` — the limit reset while the computer slept for more than about 30
# minutes, so Claude Code halts and waits for `Enter` instead of continuing. That is a keypress the
# human owes it: `blocked`.
[[hooks.map]]
event = "Notification"
matcher = "quota_auto_resume_stale"
claim = { state = "blocked", detail = "rate_limit" }

# `quota_auto_resume_disabled` — the wait ended without continuing (`autoContinueAtUsageLimit` off,
# the reset moved past 24 hours, repeated limit hits, or a blocked continuation). Nothing resumes
# until the human sends a prompt, so it is `blocked` too.
[[hooks.map]]
event = "Notification"
matcher = "quota_auto_resume_disabled"
claim = { state = "blocked", detail = "rate_limit" }

# Stop — the turn ended. `turn_end` marks it as such, so a second completion raises the done
# marker again even when tma never observed `working` in between (nothing else would: the fold
# sees idle→idle and an edge rule cannot tell that apart from a quiet idle pane).
[[hooks.map]]
event = "Stop"
claim = { state = "idle" }
turn_end = true

[capture]
visible = ["working", "idle", "blocked"]

# --- telemetry: context utilization via the statusline push shim ---
# Claude's statusline command receives a per-turn JSON payload carrying a `context_window` object
# (`used_percentage` pre-computed). `tma install-hooks claude` installs a chaining statusline shim
# that forwards it to `tma event context`; the `claude-statusline-json` parser reads the percent.
[telemetry.context]
channel = "event"
format = "claude-statusline-json"

# --- blocked: permission / confirmation / trust dialogs (selection chrome) ---
# Anchor on the invariant selection cursor parked on the affirmative option
# (`❯ 1. Yes …`): present in Claude's write/command permission prompts, its first-run
# trust dialog, and confirmation dialogs alike, and it sits inside the tail window at
# every captured width. Free-text question forms ("Do you want to …?") are deliberately
# NOT matched — they appear verbatim in ordinary conversation, so matching them
# false-blocks, and blocked is the one signal users must be able to trust. The
# leading `\s*` tolerates the indent the box draws (the bare `^❯` anchor never matched a
# real capture). The model-picker overlay uses "❯ 2. Opus"/"1. Default", never
# "❯ 1. Yes", so it stays a held history view rather than a false block.
# Backed by real captures at two widths each: the notes.txt write permission and the
# first-run trust dialog.
# NOTE: this rule still MATCHES the plan and trust dialogs — it is the two priority-110 variant
# rules at the bottom of this file that decide what they are stamped as. Widening this pattern
# would break that, because the variants refine the same line.
[[rules]]
state = "blocked"
detail = "permission"
priority = 100
region = "tail_lines(30)"
match = { line_regex = '^\s*❯ 1\. Yes' }

# --- history views: overlays/pickers freeze state, never restate ---
# Covers the model picker AND the detailed-transcript viewer. The transcript viewer
# is Claude's conversation-history overlay, toggled with ctrl+o; its invariant footer is
# `Showing detailed transcript · ctrl+o to toggle`, captured live 2026-07-25 at two widths
# (claude_transcript_w{100,60}.txt, redacted). Both are history views: the on-screen text is
# scrolled-back history, so any blocker/idle chrome in it must NOT restate the live state —
# skip_state_update raises `history_view` and the fold freezes the prior stamp.
[[rules]]
state = "idle"
priority = 90
region = "tail_lines(30)"
skip_state_update = true
match = { any = [
  { contains = "Select model" },
  { contains = "Enter to set as default" },
  { contains = "Showing detailed transcript" },
] }

# --- working: braille spinner in the OSC title (U+2800..U+28FF) ---
# Claude Code stopped emitting this at 2.1.246 — the title is a static `✳ <topic>` in every
# state there. Kept for the older versions that still animate it; the body-spinner rules at the
# bottom of this file are what carry working detection on current builds.
[[rules]]
state = "working"
priority = 60
region = "title"
match = { regex = '[\x{2800}-\x{28FF}]' }

# --- idle: idle marker in the OSC title ---
[[rules]]
state = "idle"
priority = 50
region = "title"
match = { contains = "✳" }

# --- idle fallback: the interactive prompt's mode status line is present (⏵⏵ / ⏸),
#     absent during permission dialogs and overlays; disambiguated to working by the
#     title spinner in the fold. ---
[[rules]]
state = "idle"
priority = 40
region = "tail_lines(6)"
match = { any = [ { contains = "⏵⏵" }, { contains = "⏸" } ] }

# --- blocked variants: the two dialogs whose option 1 is NOT "approve this one action" -----------
# Both are same-line refinements of the rule above: the `❯ 1. Yes` anchor it matches is the very
# line these two discriminate on, so the discriminator is inside the evaluated region wherever the
# generic rule can fire. Priority 110 beats the generic 100, so the fold stamps the specific detail.
# Order in the file does not decide the winner — the engine resolves highest-priority-per-state —
# but these are APPENDED rather than inserted because `tests/claude_manifest.rs` maps rule indices
# by declaration order.
#
# Why they need their own detail: `approve.toml` fires `1` at `blocked/permission`, and on these two
# dialogs `1` does not mean "approve this action". Re-typing the dialog is sufficient to stop the
# fire; the action manifests are unchanged. `deny.toml` is gated identically, so its Escape stops
# firing here too — deliberate, with per-detail deny rules scheduled separately.
# Captured on claude 2.1.236 at w60/w80/w100/w120/w200; option 1 reads the same at every width, so
# the match is structural, not a narrow-pane artefact.

# plan approval — option 1 is "Yes, and use auto mode": it does not approve one action, it switches
# the session into auto-approving everything that follows.
[[rules]]
state = "blocked"
detail = "plan"
priority = 110
region = "tail_lines(30)"
match = { line_regex = '^\s*❯ 1\. Yes, and use auto mode' }

# first-run trust gate — option 1 grants the whole folder read/edit/execute, and `1` is exactly what
# approve fires.
[[rules]]
state = "blocked"
detail = "trust"
priority = 110
region = "tail_lines(30)"
match = { line_regex = '^\s*❯ 1\. Yes, I trust this folder' }

# --- working: the live spinner line above the composer --------------------------------------------
# Appended, like the two rules above, because `tests/claude_manifest.rs` maps rule indices by
# declaration order.
#
# Claude 2.1.246 no longer animates the OSC title, so the only on-screen evidence a working pane
# leaves is the spinner line: a frame glyph at column 0, the gerund, and its ellipsis —
# `· Actioning… (4m 16s · ↓ 16.8k tokens)`. Frames captured live: · ✢ ✳ ✶ ✻ ✽.
#
# A finished turn reuses the same glyphs (`✻ Cogitated for 4m 23s · done 11:34 AM`, and on
# pre-2.1.2xx builds a bare `✻ Cooked for 5s`) but never the ellipsis, so `…` is the whole
# discriminator. It has to be tested per line, not per region: a pane routinely shows a finished
# line in scrollback above a live spinner, so a region-wide `not` would suppress the match.
#
# Column 0 is load-bearing. Claude indents assistant prose and tool output by two spaces, and tool
# output truncates with this same `…` — `claude_working_spinner_w149` carries such a line, so the
# anchor is under test.
#
# tail_lines(30) rather than the mode line's 6: a background-agent tree renders BELOW the mode line
# and pushes the spinner up (10 lines in `claude_working_background_agent_w149`), and a multi-line
# composer pushes it further.
[[rules]]
state = "working"
priority = 70
region = "tail_lines(30)"
match = { line_regex = '^[·✢✳✶✻✽] \S.*…' }

# The main thread parked on backgrounded work. Same glyph set, but no gerund and no ellipsis, so
# the rule above cannot see it. Observed live: `Waiting for 1 background agent to finish` and
# `Waiting for 1 dynamic workflow to finish`, so the noun is left open — the count and the
# `to finish` tail are what make it a wait rather than the completion line's `<verb> for <duration>`.
[[rules]]
state = "working"
priority = 70
region = "tail_lines(30)"
match = { line_regex = '^[·✢✳✶✻✽] Waiting for \d+ [a-z][a-z ]* to finish' }

# --- rate limit: the usage-limit auto-continue line ------------------------------------------------
# Appended, like the rules above, because `tests/claude_manifest.rs` maps rule indices by
# declaration order.
#
# SYNTHESIZED from the documented strings, not a live capture: triggering a real usage limit on
# demand is not something a test run can do. The fixtures beside these rules say so in their names,
# and the match is on the stable substrings the docs print rather than the whole line, whose middle
# carries a reset time (`at 3:45pm`) and whose separator glyph is not load-bearing.
#
# Claude Code 2.1.234+ waits in the open session and continues on its own, drawing a line at the
# bottom that reads `Usage limit reached · continuing automatically at 3:45pm · esc to cancel` and,
# at the reset, `Usage limit reset · continuing automatically`. Neither carries the spinner chrome
# the working rules key on, so without this the pane read `idle` for the whole wait — and `done`
# once it carried an unacknowledged mark.
#
# Priority 80: above the working rules (60/70) so the detail is `rate_limit` rather than bare
# working, and below the blocked rules (100/110) so a permission prompt drawn during the wait still
# wins. The agent resumes by itself here, so the ball is not with the human: `working/rate_limit`.
[[rules]]
state = "working"
detail = "rate_limit"
priority = 80
region = "tail_lines(30)"
match = { line_regex = 'Usage limit re(ached|set).*continuing automatically' }

# The halted variant. After the computer slept more than about 30 minutes with the reset falling
# inside the sleep, Claude Code does NOT continue: the line reads `Your usage limit has reset ·
# press enter to continue` and it sits there until the human presses Enter. A keypress the human
# owes it is `blocked`, and the detail says the wait was the clock rather than a permission
# decision — which is what lets `wait --until blocked` tell the two apart.
#
# Priority 95: it outranks nothing in the blocked lane, so a permission (100) or plan/trust (110)
# dialog drawn over it still stamps its own detail.
[[rules]]
state = "blocked"
detail = "rate_limit"
priority = 95
region = "tail_lines(30)"
match = { line_regex = 'Your usage limit has reset.*press enter to continue' }
