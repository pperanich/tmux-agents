[package]
name = "tma-transcript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side reader for agent transcript stores: normalized events, newest first, with bounded paging."

[lints]
workspace = true

[features]
# OpenCode's store is SQLite, so its reader needs a SQLite client and the four JSONL readers do not.
# Off here and on in the `tma` binary: a crate that only wants the file stores stays C-free, and a
# build without it serves opencode the `unsupported-store` refusal rather than a broken window.
default = []
opencode = ["dep:rusqlite"]

[dependencies]
# The typed refusal set. That, and the optional SQLite client below, is the whole dependency list:
# the workspace has no serde_json and hand-rolls its JSON writer, so `src/json.rs` is the matching
# reader, in about 200 lines.
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
# The fixture corpus declares its pinned store versions in `fixtures/stores/VERSIONS.toml`, which
# the inventory test reads. Already in the tree via tma-core; dev-only here.
toml.workspace = true
