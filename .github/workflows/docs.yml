name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          mkdir -p "$HOME/mdbook-bin"
          curl -fsSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/mdbook-bin"
          echo "$HOME/mdbook-bin" >> "$GITHUB_PATH"
      - run: mdbook build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  # Pages cannot serve a private repo on the free plan, so deployment is gated on visibility:
  # it starts working the moment the repo goes public, with no workflow change.
  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
