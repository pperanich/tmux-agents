name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      - run: mise run lint
      # The test lanes below both pass --all-features, so the default-feature build (what
      # `cargo install --path crates/tma` produces) would otherwise never be compiled here.
      - name: Check (default features)
        run: cargo check --workspace

  # The floor declared as `rust-version` in [workspace.package]. Pinned rather than a range so a
  # dependency bump that raises the real floor fails here instead of in a user's install.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # python3 is preinstalled on the runner; tmux is not. Pulled prebuilt from nixpkgs at a rev
      # pinning 3.6a, the declared floor, because the distro package is older (3.4 prints the 0x1f
      # field separator as a literal `\037`, breaking every list-panes parse).
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install tmux 3.6a from nixpkgs
        run: |
          OUT=$(nix build --no-link --print-out-paths github:NixOS/nixpkgs/3d46470bb3030020f7e1361f33514854f5bfa86d#tmux)
          echo "$OUT/bin" >> "$GITHUB_PATH"
          "$OUT/bin/tmux" -V
      # --all-features matches `mise run test`: the manifest-fixture suites are behind tma-core's
      # default-off `fixtures` feature, so without it 49 detection tests never run.
      - name: Test (tmux required)
        run: TMA_REQUIRE_TMUX=1 cargo test --workspace --all-features

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Linux lane pins the 3.6a floor; this one runs 3.7b, what brew ships today, so the two
      # lanes bracket the supported range. Pulled prebuilt from a pinned nixpkgs rev.
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Install tmux 3.7b from nixpkgs
        run: |
          OUT=$(nix build --no-link --print-out-paths github:NixOS/nixpkgs/a5cbcfe954791221bfffe2307f7d1a1bf61a871e#tmux)
          echo "$OUT/bin" >> "$GITHUB_PATH"
          "$OUT/bin/tmux" -V
      - name: Test (tmux required)
        run: TMA_REQUIRE_TMUX=1 cargo test --workspace --all-features

  # Optional: mirrors `nix flake check` (which pins tmux via nativeCheckInputs). Non-blocking so a
  # nix-side hiccup never gates the cargo lanes above.
  nix-flake-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Determinate Nix ships flakes enabled; no extra_nix_config needed. The cache rides the
      # regular GitHub Actions cache, so it needs no FlakeHub account.
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check
