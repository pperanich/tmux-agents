name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
      - run: mise run lint
      # The test lanes below both pass --all-features, so the default-feature build (what
      # `cargo install --path crates/tma` produces) would otherwise never be compiled here.
      - name: Check (default features)
        run: cargo check --workspace

  # The floor declared as `rust-version` in [workspace.package]. Pinned rather than a range so a
  # dependency bump that raises the real floor fails here instead of in a user's install.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  # The tmux-touching suites, shared with the release workflow so a tag cannot ship past a red
  # lane: one definition, called from both, rather than a copy that drifts.
  tests:
    uses: ./.github/workflows/tests.yml

  # Optional: mirrors `nix flake check` (which pins tmux via nativeCheckInputs). Non-blocking so a
  # nix-side hiccup never gates the cargo lanes above.
  nix-flake-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Determinate Nix ships flakes enabled; no extra_nix_config needed. The cache rides the
      # regular GitHub Actions cache, so it needs no FlakeHub account.
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check
